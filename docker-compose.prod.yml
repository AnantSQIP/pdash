# Production stack: Postgres + API + Web. Run from the repo root:
#   cp .env.production.example .env.production   # then edit the secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# WHY THE SECRETS ARRIVE VIA env_file RATHER THAN ${INTERPOLATION}
#
# They used to be written as ${POSTGRES_USER} and friends. That is INTERPOLATION, resolved by the
# docker-compose process itself before a container exists, and it reads only the shell environment
# or a file named exactly `.env`. This file is called `.env.production`, so unless every command
# carried `--env-file .env.production` every one of those variables resolved to an EMPTY STRING.
#
# Compose does not treat that as an error. It warns once per variable, among a wall of other
# output, and carries on. Postgres then failed its healthcheck — `pg_isready -U` with no username
# — and api and web refused to start behind an unhealthy dependency. The site returned 502 and the
# error on screen talked about health, not configuration. It cost an outage.
#
# `env_file` is a different mechanism: it hands variables to the CONTAINER at runtime, so nothing
# has to be interpolated and no flag has to be remembered. It also fails loudly and immediately if
# the file is missing, which is the behaviour you want from a missing production environment.
#
# The interpolated lines had to GO, not merely be supplemented: `environment:` overrides
# `env_file:`, so leaving `POSTGRES_USER: ${POSTGRES_USER}` in place would have kept overwriting
# the correct value with a blank one.
#
# The web container proxies /api/* to the api container over the compose network, so only
# the web port is published. Postgres and the API are not exposed to the host.
#
# RESOURCE LIMITS, LOG ROTATION AND HEALTHCHECKS
#
# All three services share one VPS with Postgres. Without ceilings a leak or a runaway query in
# the API starves the database, so a recoverable fault in one process becomes a total outage.
# The limits below suit a 4 GB box; check `free -h` on the server and override via .env.production
# if yours differs. They are ceilings, not reservations — nothing is consumed by setting them.
#
# Docker's default json-file log driver grows without bound. On a VPS that ends exactly one way:
# the disk fills, Postgres cannot write, and everything stops. Rotation is three lines per service.
#
# `restart: unless-stopped` restarts a CRASHED container and does nothing for a HUNG one. A
# healthcheck is what turns "the process is alive" into "the service is answering" — the precise
# failure already seen twice with the tunnel, where the process ran and the service was dead.
# node is used rather than curl or wget because node:20-slim ships neither.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Postgres gets the largest share: it is the one process whose failure loses data rather than
    # merely serving an error.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # POSTGRES_USER / _PASSWORD / _DB come from here. Compose refuses to start if the file is
    # absent, which is the right answer for a missing production environment.
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes to a literal $, so the shell INSIDE the container expands this from the
      # container's own environment at run time. Written as ${POSTGRES_USER} it was interpolated
      # by compose instead, and became `pg_isready -U` — which fails, marks postgres unhealthy,
      # and takes api and web down with it.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-768m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Answering, not merely running. start_period covers boot: the API runs `prisma migrate
    # deploy` before it listens, and a slow migration must not be read as a failed service.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    # DATABASE_URL, JWT_ACCESS_SECRET and CORS_ORIGINS come from here.
    env_file:
      - .env.production
    environment:
      # These are fixed for this stack and deliberately NOT taken from the env file: they must not
      # be overridable by editing it. `environment` wins over `env_file`, which is what makes that
      # guarantee hold.
      NODE_ENV: production
      API_PORT: "4000"
      AUTH_DEV_TRUST_HEADER: "false"
      # Uploaded documents (patent PDFs, attachments) live on this mounted volume, NOT in the DB.
      DOCUMENT_STORAGE_DIR: /app/.data/documents
    volumes:
      - docdata:/app/.data
    expose:
      - "4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the Next standalone build so /api/* proxies to the api service (not localhost).
        API_ORIGIN: http://api:4000
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # /login is unauthenticated and server-rendered, so a 200 means Next is actually serving
    # pages rather than just holding the port open.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy
      # Server-side proxy target — the api service on the compose network.
      API_ORIGIN: http://api:4000
    ports:
      # Bind to localhost by default so Docker's iptables rules don't bypass the host
      # firewall and expose :3000 to the internet. A TLS reverse proxy (Caddy) fronts it.
      # Set WEB_BIND=0.0.0.0 only if you intentionally want the raw port public.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  docdata:
